# Pin the license selection to the actual target. Build dependencies are included
# conservatively; dev-only and unrelated platform packages are excluded.
accepted = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "MPL-2.0", "OpenSSL", "Unicode-3.0", "Unlicense", "Zlib", "bzip2-1.0.6", "0BSD"]
targets = ["riscv64gc-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
workarounds = ["ring"]
